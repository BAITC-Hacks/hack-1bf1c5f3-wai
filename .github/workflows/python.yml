name: Python challenge

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: challenges/beeline-tariff-campaigns
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: challenges/beeline-tariff-campaigns/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python local_eval.py
      - run: python make_submission.py
      - run: git diff --exit-code -- submission.csv
